          stroke="currentColor"
          stroke-width="3"/>

  <!-- Group (centered at 28,28) -->
  <g transform="translate(28 28)">
    <!-- Left triangle -->
    <polygon points="-2,-10 -2,10 -14,0"
             stroke="currentColor"
             stroke-width="3"
             fill="none"
             stroke-linejoin="round"/>

    <!-- Right triangle -->
